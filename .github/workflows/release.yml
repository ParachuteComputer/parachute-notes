# Release workflow — triggered by pushing a semver tag.
#
# Tag conventions (matches parachute-patterns governance rule 2):
#   - rc:     v<X>.<Y>.<Z>-rc.<N>   (e.g. v0.1.4-rc.1)
#   - stable: v<X>.<Y>.<Z>          (e.g. v0.1.4)
#
# Scope: this workflow publishes ONLY `@openparachute/notes-ui` (the UI
# bundle in `packages/notes-ui/`). The sibling package
# `@openparachute/notes` (the daemon in `packages/notes-daemon/`) is
# DEPRECATED as of 2026-05-22 (see packages/notes-daemon/DEPRECATED.md)
# and is not published from CI. Notes-as-UI is the future; notes-daemon
# is being archived in phases.
#
# Release flow:
#   1. Code-touching PR merges to main, bumping `version` in
#      packages/notes-ui/package.json (rc.N → rc.N+1 for the rc chain;
#      or drop -rc.N suffix for stable).
#   2. After merge, push a matching tag:
#        VERSION="v$(node -p "require('./packages/notes-ui/package.json').version")"
#        git tag "$VERSION" && git push origin "$VERSION"
#   3. CI runs tests, then publishes to npm with provenance attestation
#      (dist-tag = rc or latest, auto-detected from the tag string).
#
# Operator setup (one-time):
#   - npmjs.com → @openparachute/notes-ui → Settings → Trusted Publishers
#     → Add → GitHub Actions:
#       org=ParachuteComputer, repo=parachute-notes,
#       workflow=release.yml, environment=(blank)
#   - No NPM_TOKEN secret needed; OIDC via `id-token: write` below.
#
# Why tag-triggered (not push-to-main):
#   - tag = explicit release signal; main commits without a tag don't publish.
#   - Preserves a deliberate gate (you push the tag when you mean to ship).
#   - Tag-as-canonical means the tag itself is the audit trail of what was
#     released and when.

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'

concurrency:
  # Don't let two releases race on the same tag.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3
      - name: install deps
        run: bun install --frozen-lockfile
      - name: typecheck
        # Workspace-root script delegates to notes-ui (only typechecked package).
        run: bun run typecheck
      - name: notes-ui tests
        working-directory: packages/notes-ui
        run: bun run test

  publish-npm:
    name: publish notes-ui to npm
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance attestation + Trusted Publishing OIDC.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3
      - uses: actions/setup-node@v4
        with:
          # Node 24 ships npm 11.5+ which has Trusted Publishing OIDC
          # support built in. Node 20 LTS only has npm 10 and would
          # silently fall back to token auth (failing without NPM_TOKEN).
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: install deps
        run: bun install --frozen-lockfile
      - name: verify package.json version matches tag
        # Defense against tag-vs-package.json drift. If they don't match,
        # we'd publish under the wrong version. Reads notes-ui's version
        # explicitly — the workspace-root package.json is private.
        run: |
          PKG_VERSION=$(bun -e "console.log(require('./packages/notes-ui/package.json').version)")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::packages/notes-ui/package.json version ($PKG_VERSION) doesn't match tag ($TAG_VERSION)"
            exit 1
          fi
      - name: publish
        # Trusted Publishing: npm verifies the OIDC token from this workflow
        # against the package's configured trusted publisher rule
        # (org=ParachuteComputer, repo=parachute-notes, workflow=release.yml).
        # No NPM_TOKEN secret needed; `id-token: write` permission above
        # makes the OIDC token available to npm CLI.
        #
        # `npm publish` runs `prepublishOnly` (= `bun run build`) which
        # produces the dist/ tarball. `meta.json` ships alongside dist/
        # per the package's `files` array — parachute-app's bootstrap
        # validator requires it.
        working-directory: packages/notes-ui
        run: |
          # Detect rc vs stable from tag name. Tag pattern in `on:` above
          # enforces the shape, so this is just disambiguation.
          if [[ "$GITHUB_REF_NAME" =~ -rc\. ]]; then
            DIST_TAG=rc
          else
            DIST_TAG=latest
          fi
          echo "publishing notes-ui with dist-tag=$DIST_TAG"
          npm publish --tag "$DIST_TAG" --access public --provenance
